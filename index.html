<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آية AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; overflow: hidden; }

    /* ===== شاشة المسح (سكانر) ===== */
    #scanner {
      position: fixed; top: 50%; left: 50%;
      width: 68vmin; height: 68vmin;
      transform: translate(-50%, -50%);
      z-index: 5; pointer-events: none;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5);
      border-radius: 18px;
      border: 4px solid #00e676;
    }
    #scanner b {
      position: absolute; left: 6%; width: 88%; height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #00e676, transparent);
      box-shadow: 0 0 14px 4px rgba(0,230,118,0.7);
      animation: scan 2s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 6%; } to { top: 94%; } }

    /* ===== الجزيئات المتطايرة (نجوم/ورود/قلوب) ===== */
    .deco {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      font-size: 28px;
      will-change: transform, opacity;
    }
    @keyframes decoBurst {
      from { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
      to   { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.3) rotate(260deg); }
    }
    @keyframes decoDrift {
      0%   { opacity: 0; transform: translate(0,0) scale(0.6); }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); }
    }
  </style>
</head>

<body>
  <!-- الموسيقى الخلفية -->
  <audio id="bgm" src="./assets/bgm.mp3" preload="auto" loop></audio>

  <div id="scanner"><b></b></div>

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: no;"
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- التارجيت: السحابة والآية مثبتين عليه -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- السحابة البيضاء — بتطفو ببطء وتظهر بنطّة لطيفة -->
      <a-plane id="cloud" visible="false"
        position="0 -0.17 0" width="1.25" height="0.68" scale="0 0 0"
        material="transparent: true; depthWrite: false"
        animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; easing: easeOutBack; startEvents: appear"
        animation__float="property: position; from: 0 -0.19 0; to: 0 -0.13 0; dur: 6000; easing: easeInOutSine; loop: true; dir: alternate; delay: 900">
      </a-plane>

      <!-- الآية مرسومة فوق السحابة مباشرة، بدون برواز -->
      <a-plane id="versePlane" visible="false"
        position="0 -0.17 0.015" width="1.05" height="0.55" scale="0 0 0"
        material="transparent: true; depthWrite: false"
        animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; easing: easeOutBack; startEvents: appear; delay: 150"
        animation__float="property: position; from: 0 -0.19 0.015; to: 0 -0.13 0.015; dur: 6000; easing: easeInOutSine; loop: true; dir: alternate; delay: 900">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    /* ============================================================
       ✏️ غيّر الآية من هنا بس
       ============================================================ */
    const VERSE = "لِتَصِرْ كُلُّ أُمُورِكُمْ فِي مَحَبَّةٍ";
    const REF   = "(كو1 14:16)";
    /* ============================================================ */

    const target     = document.getElementById("target");
    const scanner    = document.getElementById("scanner");
    const cloud      = document.getElementById("cloud");
    const versePlane = document.getElementById("versePlane");
    const bgm        = document.getElementById("bgm");
    bgm.volume = 0.55;

    /* ---------- رسم الآية على كانفس (بدون برواز، فوق السحابة مباشرة) ---------- */
    function makeVerseTexture(verse, ref) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 560;
      const x = c.getContext("2d");

      x.textAlign = "center";
      x.textBaseline = "middle";
      x.direction = "rtl";

      const lines = wrapText(x, verse, 840);
      const fs = lines.length > 2 ? 72 : 92;   // نص أكبر لأن الآية أقصر
      const fontStack = "'Scheherazade New', 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', serif";
      x.font = "700 " + fs + "px " + fontStack;

      const startY = 260 - ((lines.length - 1) * fs * 1.45) / 2;

      // تدرّج لوني دافئ للنص (ذهبي-بنفسجي) بدل لون واحد مسطح
      const grad = x.createLinearGradient(0, startY - fs, 0, startY + lines.length * fs * 1.45);
      grad.addColorStop(0, "#6a3fb5");
      grad.addColorStop(0.5, "#8a3fc9");
      grad.addColorStop(1, "#b5389a");

      lines.forEach((ln, i) => {
        const ly = startY + i * fs * 1.45;

        // هالة بيضاء ناعمة وواسعة عشان الوضوح فوق السحابة
        x.shadowColor = "rgba(255,255,255,0.98)";
        x.shadowBlur = 22;
        x.lineWidth = 10;
        x.strokeStyle = "rgba(255,255,255,0.9)";
        x.strokeText(ln, 512, ly);

        // النص نفسه بتدرّج لوني وبريق خفيف
        x.shadowColor = "rgba(255, 215, 120, 0.55)";
        x.shadowBlur = 16;
        x.fillStyle = grad;
        x.fillText(ln, 512, ly);
      });

      // خط زخرفي رفيع تحت الآية
      const lastY = startY + (lines.length - 1) * fs * 1.45 + fs * 0.95;
      x.shadowBlur = 0;
      x.strokeStyle = "rgba(181,56,154,0.55)";
      x.lineWidth = 3;
      x.beginPath();
      x.moveTo(512 - 130, lastY);
      x.lineTo(512 + 130, lastY);
      x.stroke();

      // المرجع تحت بخط أهدأ وأصغر
      x.shadowColor = "rgba(255,255,255,0.9)";
      x.shadowBlur = 8;
      x.font = "600 36px Tahoma, Arial";
      x.fillStyle = "#8a5fb0";
      x.fillText(ref, 512, lastY + 46);

      return c;
    }

    function wrapText(ctx, text, maxW) {
      const words = text.split(" ");
      const lines = [];
      let line = "";
      words.forEach(w => {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
        else line = test;
      });
      if (line) lines.push(line);
      return lines;
    }

    /* ---------- رسم السحابة البيضاء ---------- */
    function makeCloudTexture() {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 560;
      const x = c.getContext("2d");

      const puffs = [
        [512, 310, 310], [290, 340, 195], [740, 340, 205],
        [420, 245, 175], [630, 240, 170], [190, 375, 135],
        [840, 375, 140], [512, 395, 270]
      ];
      puffs.forEach(([cx, cy, r]) => {
        const g = x.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        g.addColorStop(0, "rgba(255,255,255,0.98)");
        g.addColorStop(0.7, "rgba(255,255,255,0.85)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
      });
      return c;
    }

    /* ---------- تركيب النسيج على الـ Planes ---------- */
    const scene = document.querySelector("a-scene");

    function buildTextures() {
      const cloudTex = new THREE.CanvasTexture(makeCloudTexture());
      cloud.getObject3D("mesh").material.map = cloudTex;
      cloud.getObject3D("mesh").material.needsUpdate = true;

      const verseTex = new THREE.CanvasTexture(makeVerseTexture(VERSE, REF));
      verseTex.anisotropy = 4;
      versePlane.getObject3D("mesh").material.map = verseTex;
      versePlane.getObject3D("mesh").material.needsUpdate = true;
    }

    scene.addEventListener("loaded", () => {
      // نستنى الخطوط العربية تتحمّل الأول عشان الآية ما ترجعش لخط افتراضي
      if (document.fonts && document.fonts.ready) {
        Promise.all([
          document.fonts.load("700 90px 'Amiri'"),
          document.fonts.load("700 90px 'Scheherazade New'")
        ]).then(() => document.fonts.ready).then(buildTextures).catch(buildTextures);
      } else {
        buildTextures();
      }
    });

    /* ============================================================
       الزخرفة المتطايرة: نجوم + ورود + قلوب
       ============================================================ */
    const DECO_ICONS = ["⭐", "✨", "🌸", "🌺", "💖", "💗", "🌟"];

    // دفعة زخرفة تتفرقع من نص الشاشة لحظة ظهور الآية
    function decoBurst(count = 18) {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "deco";
        el.textContent = DECO_ICONS[Math.floor(Math.random() * DECO_ICONS.length)];
        el.style.left = cx + "px";
        el.style.top = cy + "px";
        el.style.fontSize = (20 + Math.random() * 18) + "px";
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const dist = 90 + Math.random() * 140;
        el.style.setProperty("--x", Math.cos(angle) * dist + "px");
        el.style.setProperty("--y", Math.sin(angle) * dist + "px");
        el.style.animation = "decoBurst 1s ease-out forwards";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    // رذاذ هادئ مستمر طول ما الآية ظاهرة
    let driftTimer = null;
    function startDrift() {
      stopDrift();
      driftTimer = setInterval(() => {
        const el = document.createElement("div");
        el.className = "deco";
        el.textContent = DECO_ICONS[Math.floor(Math.random() * DECO_ICONS.length)];
        const startX = innerWidth * (0.15 + Math.random() * 0.7);
        const startY = innerHeight * (0.55 + Math.random() * 0.25);
        el.style.left = startX + "px";
        el.style.top = startY + "px";
        el.style.fontSize = (16 + Math.random() * 14) + "px";
        el.style.setProperty("--x", (Math.random() * 60 - 30) + "px");
        el.style.setProperty("--y", (-120 - Math.random() * 80) + "px");
        el.style.animation = "decoDrift 3.2s ease-out forwards";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }, 450);
    }
    function stopDrift() {
      if (driftTimer) { clearInterval(driftTimer); driftTimer = null; }
    }

    function playBgm() { bgm.play().catch(() => {}); }

    // ===== لما التارجيت يتعرف =====
    target.addEventListener("targetFound", () => {
      scanner.style.display = "none";

      cloud.setAttribute("scale", "0 0 0");
      versePlane.setAttribute("scale", "0 0 0");
      cloud.setAttribute("visible", "true");
      versePlane.setAttribute("visible", "true");
      cloud.emit("appear");
      versePlane.emit("appear");

      decoBurst();
      startDrift();
      playBgm();
    });

    // ===== لما التارجيت يختفي =====
    target.addEventListener("targetLost", () => {
      scanner.style.display = "block";
      cloud.setAttribute("visible", "false");
      versePlane.setAttribute("visible", "false");
      stopDrift();
      bgm.pause();
    });

    // أول لمسة تفتح تصريح الصوت
    document.addEventListener("pointerdown", () => {
      if (!bgm.paused) return;
      bgm.play().then(() => {
        if (versePlane.getAttribute("visible") !== "true") bgm.pause();
      }).catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
