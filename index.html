<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آية AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    /* ===== شاشة المسح (سكانر) ===== */
    #scanner {
      position: fixed; top: 50%; left: 50%;
      width: 68vmin; height: 68vmin;
      transform: translate(-50%, -50%);
      z-index: 5; pointer-events: none;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5);
      border-radius: 18px;
      border: 4px solid #00e676;
    }
    #scanner b {
      position: absolute; left: 6%; width: 88%; height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #00e676, transparent);
      box-shadow: 0 0 14px 4px rgba(0,230,118,0.7);
      animation: scan 2s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 6%; } to { top: 94%; } }
  </style>
</head>

<body>
  <!-- الموسيقى الخلفية -->
  <audio id="bgm" src="./assets/bgm.mp3" preload="auto" loop></audio>

  <div id="scanner"><b></b></div>

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: no;"
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- التارجيت: الآية والسحابة مثبتين عليه -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- السحابة البيضاء — بتطفو بطيء (7 ثواني لكل اتجاه) -->
      <a-plane id="cloud" visible="false"
        position="0 -0.15 0" width="1.15" height="0.6"
        material="transparent: true; depthWrite: false"
        animation="property: position; from: 0 -0.17 0; to: 0 -0.11 0; dur: 7000; easing: easeInOutSine; loop: true; dir: alternate">
      </a-plane>

      <!-- الآية داخل برواز دهبي — في الثلث الأخير من التارجيت -->
      <a-plane id="versePlane" visible="false"
        position="0 -0.15 0.015" width="0.95" height="0.5"
        material="transparent: true; depthWrite: false">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    /* ============================================================
       ✏️ غيّر الآية من هنا بس
       ============================================================ */
    const VERSE = "أنا عندي رجاء لأني بإيماني أرتبط برب العظمة الذي لا ينساني";
    const REF   = "إشعياء ٤٩ : ١٥";
    /* ============================================================ */

    const target     = document.getElementById("target");
    const scanner    = document.getElementById("scanner");
    const cloud      = document.getElementById("cloud");
    const versePlane = document.getElementById("versePlane");
    const bgm        = document.getElementById("bgm");
    bgm.volume = 0.55;

    /* ---------- رسم الآية على كانفس (عشان الخط العربي يطلع مظبوط) ---------- */
    function makeVerseTexture(verse, ref) {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 560;
      const x = c.getContext("2d");

      // برواز دهبي مزدوج
      x.strokeStyle = "#d4af37";
      x.lineWidth = 14;
      roundRect(x, 22, 22, 980, 516, 36); x.stroke();
      x.lineWidth = 4;
      roundRect(x, 48, 48, 928, 464, 24); x.stroke();

      // النص
      x.fillStyle = "#4a2c14";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.direction = "rtl";

      const lines = wrapText(x, verse, 860);
      const fs = lines.length > 2 ? 58 : 68;
      x.font = "bold " + fs + "px 'Traditional Arabic', 'Amiri', Tahoma, serif";

      const startY = 280 - ((lines.length - 1) * fs * 1.5) / 2;
      lines.forEach((ln, i) => x.fillText(ln, 512, startY + i * fs * 1.5));

      // المرجع تحت
      x.font = "bold 40px Tahoma, Arial";
      x.fillStyle = "#8b6914";
      x.fillText(ref, 512, 490);

      return c;
    }

    function wrapText(ctx, text, maxW) {
      const words = text.split(" ");
      const lines = [];
      let line = "";
      words.forEach(w => {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
        else line = test;
      });
      if (line) lines.push(line);
      return lines;
    }

    function roundRect(x, px, py, w, h, r) {
      x.beginPath();
      x.moveTo(px + r, py);
      x.arcTo(px + w, py, px + w, py + h, r);
      x.arcTo(px + w, py + h, px, py + h, r);
      x.arcTo(px, py + h, px, py, r);
      x.arcTo(px, py, px + w, py, r);
      x.closePath();
    }

    /* ---------- رسم السحابة البيضاء ---------- */
    function makeCloudTexture() {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 540;
      const x = c.getContext("2d");

      // مجموعة فقاعات بيضاء متدرجة تشكل سحابة
      const puffs = [
        [512, 300, 300], [300, 330, 190], [730, 330, 200],
        [420, 240, 170], [620, 235, 165], [200, 360, 130],
        [830, 360, 135], [512, 380, 260]
      ];
      puffs.forEach(([cx, cy, r]) => {
        const g = x.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        g.addColorStop(0, "rgba(255,255,255,0.98)");
        g.addColorStop(0.7, "rgba(255,255,255,0.85)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
      });
      return c;
    }

    /* ---------- تركيب النسيج على الـ Planes ---------- */
    const scene = document.querySelector("a-scene");
    scene.addEventListener("loaded", () => {
      const cloudTex = new THREE.CanvasTexture(makeCloudTexture());
      cloud.getObject3D("mesh").material.map = cloudTex;
      cloud.getObject3D("mesh").material.needsUpdate = true;

      const verseTex = new THREE.CanvasTexture(makeVerseTexture(VERSE, REF));
      verseTex.anisotropy = 4;
      versePlane.getObject3D("mesh").material.map = verseTex;
      versePlane.getObject3D("mesh").material.needsUpdate = true;
    });

    function playBgm() { bgm.play().catch(() => {}); }

    // ===== لما التارجيت يتعرف =====
    target.addEventListener("targetFound", () => {
      scanner.style.display = "none";
      cloud.setAttribute("visible", "true");
      versePlane.setAttribute("visible", "true");
      playBgm();
    });

    // ===== لما التارجيت يختفي =====
    target.addEventListener("targetLost", () => {
      scanner.style.display = "block";
      cloud.setAttribute("visible", "false");
      versePlane.setAttribute("visible", "false");
      bgm.pause();
    });

    // أول لمسة تفتح تصريح الصوت
    document.addEventListener("pointerdown", () => {
      if (!bgm.paused) return;
      bgm.play().then(() => {
        if (versePlane.getAttribute("visible") !== "true") bgm.pause();
      }).catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
