<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آية AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    /* ===== شاشة المسح (سكانر) ===== */
    #scanner {
      position: fixed; top: 50%; left: 50%;
      width: 68vmin; height: 68vmin;
      transform: translate(-50%, -50%);
      z-index: 5; pointer-events: none;
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5);
      border-radius: 18px;
      border: 4px solid #00e676;
    }
    #scanner b {
      position: absolute; left: 6%; width: 88%; height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #00e676, transparent);
      box-shadow: 0 0 14px 4px rgba(0,230,118,0.7);
      animation: scan 2s ease-in-out infinite alternate;
    }
    @keyframes scan { from { top: 6%; } to { top: 94%; } }

    /* =========================================================
       صندوق الآية — في الثلث الأخير من التارجيت (تحت)
       ========================================================= */
    #verseBox {
      position: fixed;
      left: 50%;
      bottom: 14%;            /* ← الثلث الأخير: لو عايز أنزل أكتر زوّد الرقم ده */
      transform: translateX(-50%) translateY(40px) scale(0.8);
      width: min(84%, 480px);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.9s cubic-bezier(.34,1.56,.64,1);
    }
    #verseBox.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* البرواز المزدوج */
    .frame-outer {
      background: linear-gradient(135deg, #3d2b1f, #5c4033, #3d2b1f);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 12px rgba(255,215,0,0.25);
      animation: glow 3s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 12px rgba(255,215,0,0.2); }
      to   { box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 28px rgba(255,215,0,0.55); }
    }
    .frame-inner {
      background: linear-gradient(160deg, #fffbe6, #fff3c4);
      border: 3px solid #d4af37;
      border-radius: 14px;
      padding: 22px 20px 16px;
      text-align: center;
    }

    /* نص الآية */
    #verseText {
      font-family: "Traditional Arabic", "Amiri", Tahoma, serif;
      font-size: clamp(20px, 5.5vw, 30px);
      line-height: 1.9;
      color: #4a2c14;
      font-weight: bold;
    }
    /* ظهور الآية كلمة كلمة */
    #verseText span {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px) rotate(4deg);
      animation: wordIn 0.6s ease forwards;
    }
    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }
    #verseRef {
      margin-top: 10px;
      font-size: clamp(13px, 3.5vw, 17px);
      color: #8b6914;
      font-family: Tahoma, Arial;
      opacity: 0;
      animation: wordIn 0.8s ease 2.2s forwards;
    }

    /* ===== القلوب والورود المتطايرة ===== */
    .floater {
      position: fixed;
      z-index: 9;
      pointer-events: none;
      font-size: 26px;
      opacity: 0;
      animation: floatUp var(--dur) ease-in var(--delay) infinite;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-46vh) scale(1.15) rotate(30deg); }
    }
  </style>
</head>

<body>
  <!-- الموسيقى الخلفية -->
  <audio id="bgm" src="./assets/bgm.mp3" preload="auto" loop></audio>

  <div id="scanner"><b></b></div>

  <!-- صندوق الآية -->
  <div id="verseBox">
    <div class="frame-outer">
      <div class="frame-inner">
        <div id="verseText"></div>
        <div id="verseRef"></div>
      </div>
    </div>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; uiScanning: no;"
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- التارجيت فاضي — مفيش موديل، الآية تظهر كـ overlay -->
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <script>
    /* ============================================================
       ✏️ غيّر الآية من هنا بس
       ============================================================ */
    const VERSE  = "أنا عندي رجاء لأني بإيماني أرتبط برب العظمة الذي لا ينساني";
    const REF    = "إشعياء ٤٩ : ١٥";
    /* ============================================================ */

    const target   = document.getElementById("target");
    const scanner  = document.getElementById("scanner");
    const verseBox = document.getElementById("verseBox");
    const bgm      = document.getElementById("bgm");
    bgm.volume = 0.55;

    let floaters = [];

    // كتابة الآية كلمة كلمة
    function renderVerse() {
      const box = document.getElementById("verseText");
      box.innerHTML = "";
      VERSE.split(" ").forEach((w, i) => {
        const s = document.createElement("span");
        s.textContent = w + " ";
        s.style.animationDelay = (0.6 + i * 0.18) + "s";
        box.appendChild(s);
      });
      document.getElementById("verseRef").textContent = REF;
    }

    // توليد قلوب وورود بتتطاير حوالين البرواز
    function spawnFloaters() {
      clearFloaters();
      const icons = ["❤️", "🌹", "💖", "🌷", "💝", "🌸"];
      const box = verseBox.getBoundingClientRect();
      for (let i = 0; i < 14; i++) {
        const f = document.createElement("div");
        f.className = "floater";
        f.textContent = icons[Math.floor(Math.random() * icons.length)];
        // مواقع عشوائية حوالين البرواز (يمين وشمال وفوق)
        const side = Math.random() < 0.5 ? -1 : 1;
        const x = box.left + box.width / 2 + side * (box.width / 2 + 20 + Math.random() * 60);
        f.style.left = x + "px";
        f.style.top  = (box.top + Math.random() * box.height) + "px";
        f.style.fontSize = (18 + Math.random() * 18) + "px";
        f.style.setProperty("--dur", (3 + Math.random() * 3) + "s");
        f.style.setProperty("--delay", (Math.random() * 2.5) + "s");
        document.body.appendChild(f);
        floaters.push(f);
      }
    }
    function clearFloaters() {
      floaters.forEach(f => f.remove());
      floaters = [];
    }

    function playBgm() { bgm.play().catch(() => {}); }

    // ===== لما التارجيت يتعرف =====
    target.addEventListener("targetFound", () => {
      scanner.style.display = "none";
      renderVerse();
      verseBox.classList.add("show");
      spawnFloaters();
      playBgm();
    });

    // ===== لما التارجيت يختفي =====
    target.addEventListener("targetLost", () => {
      scanner.style.display = "block";
      verseBox.classList.remove("show");
      clearFloaters();
      bgm.pause();
    });

    // أول لمسة تفتح تصريح الصوت
    document.addEventListener("pointerdown", () => {
      if (!bgm.paused) return;
      bgm.play().then(() => {
        if (!verseBox.classList.contains("show")) bgm.pause();
      }).catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
